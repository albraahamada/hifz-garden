<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff5d97">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جدول منو">
<title>جدول منو البطلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=Almarai:wght@400;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --card:#ffffff; --card2:#fff7fb;
  --ink:#3d2b57; --muted:#9088ab; --line:#f0e7f4;
  --rose:#ff5d97; --grape:#8b5cf6; --mint:#12c2a0; --gold:#ffab1f; --sky:#37c1e8; --coral:#ff7a59;
  --red:#f04e6c;
  --gap:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{color:var(--ink);
  background:linear-gradient(165deg,#fff0f7 0%,#f2f0ff 48%,#fff6ec 100%);
  background-attachment:fixed;
  font-family:'Almarai',system-ui,sans-serif;font-size:15px;line-height:1.65;padding:0 0 40px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ===== الترويسة + التنقل ===== */
header{padding:22px 0 0}
.eyebrow{font-family:'Changa',sans-serif;font-size:13px;letter-spacing:.04em;
  color:var(--rose);margin:0 0 6px;font-weight:700}
h1{font-family:'Changa',sans-serif;font-weight:800;font-size:30px;line-height:1.2;margin:0;
  background:linear-gradient(92deg,var(--grape),var(--rose) 55%,var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.daterow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}
.subhead{color:var(--muted);font-size:13px;font-weight:700}
.todaybtn{flex:0 0 auto;background:linear-gradient(120deg,var(--grape),var(--rose));color:#fff;border:none;
  border-radius:12px;padding:9px 20px;font-family:'Almarai',sans-serif;font-weight:800;font-size:13px;cursor:pointer;
  box-shadow:0 4px 12px rgba(255,93,151,.28);white-space:nowrap}
.todaybtn:active{transform:scale(.97)}
.navrow{display:flex;gap:10px;margin-top:12px}
.navrow button{flex:1;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:11px;font-family:'Almarai',sans-serif;font-weight:800;font-size:13px;cursor:pointer;
  box-shadow:0 3px 10px rgba(140,110,180,.08)}
.navrow button:active{transform:scale(.98)}
.navrow button:focus-visible,.todaybtn:focus-visible{outline:2px solid var(--grape);outline-offset:2px}
.navrow button:disabled{opacity:.4;cursor:not-allowed}

/* ===== رسم التقدّم الأسبوعي ===== */
.hero{margin:var(--gap) 0 0;border-radius:22px;padding:17px 16px 15px;color:#fff;
  background:linear-gradient(130deg,#8b5cf6 0%,#ff5d97 55%,#ffab1f 115%);
  box-shadow:0 12px 30px rgba(255,93,151,.28)}
.herohead{font-family:'Changa',sans-serif;font-weight:800;font-size:15px;margin:0 0 14px;text-align:center;letter-spacing:.02em}
.weekrings{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:15px}
.wring{display:flex;flex-direction:column;align-items:center;gap:6px}
.wdisc{width:100%;max-width:50px;aspect-ratio:1;border-radius:50%;position:relative;
  background:conic-gradient(var(--c,#fff) calc(var(--p,0)*1%), rgba(255,255,255,.28) 0)}
.wdisc::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#fff}
.wdisc b{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-size:14px;font-weight:800;color:var(--ink)}
.wlbl{font-size:10.5px;font-weight:700;opacity:.96;font-family:'IBM Plex Mono',monospace}
.periodbar{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;height:13px;margin-bottom:9px}
.pseg{border-radius:6px;background:rgba(255,255,255,.26);transition:background .4s}
.pseg.part{background:rgba(255,255,255,.62)}
.pseg.done{background:#fff;box-shadow:0 0 8px rgba(255,255,255,.55)}
.periodcap{text-align:center;font-family:'Changa',sans-serif;font-weight:700;font-size:13px}

/* ===== نصيحة الأسبوع ===== */
.tip{margin:var(--gap) 0 0;padding:14px 15px;border-radius:16px;
  background:linear-gradient(100deg,#efe9ff,#ffe9f2);border:1px solid var(--line)}
.tip b{display:block;font-family:'Changa',sans-serif;font-size:13px;color:var(--grape);margin-bottom:3px}
.tip span{font-size:13.5px;line-height:1.6}

/* ===== مؤشر اليوم ===== */
.scorerow{display:flex;align-items:center;gap:16px;margin:var(--gap) 0 0;
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 16px;
  box-shadow:0 6px 18px rgba(140,110,180,.1)}
.ring{position:relative;flex:0 0 84px;height:84px}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num{font-family:'Changa',sans-serif;font-weight:800;font-size:22px;line-height:1;color:var(--rose)}
.ring .lbl{font-size:10px;color:var(--muted);margin-top:2px}
.scoretext h2{font-family:'Changa',sans-serif;font-size:17px;margin:0 0 3px;font-weight:700}
.scoretext p{margin:0;font-size:12.5px;color:var(--muted)}

.sec{font-family:'Changa',sans-serif;font-size:15px;color:var(--ink);
  margin:26px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line);font-weight:700}

/* ===== العناصر ===== */
.fajr{display:flex;align-items:baseline;gap:8px;padding:11px 14px;margin-bottom:9px;
  border-radius:14px;background:#fff5e6;border:1px dashed #ffd591}
.fajr .lab{font-weight:700;font-size:14px;color:#e29200}
.fajr .dots{flex:1;border-bottom:2px dotted #ffd591;transform:translateY(-4px)}
.fajr .val{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#e29200}
.fajr .note{width:100%;font-size:11.5px;color:var(--muted);margin-top:4px}

.task{display:block;width:100%;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:13px 14px;margin-bottom:9px;cursor:pointer;text-align:right;
  color:inherit;font-family:inherit;font-size:inherit;box-shadow:0 4px 12px rgba(140,110,180,.07);
  transition:background .18s,border-color .18s,transform .1s,box-shadow .18s}
.task:active{transform:scale(.988)}
.task:focus-visible{outline:2px solid var(--grape);outline-offset:2px}
.task.done{background:linear-gradient(100deg,#e7fbf4,#eafff9);border-color:#a6ecd8}
.task.anchor{border-right:4px solid var(--rose)}
.task.done.anchor{border-right-color:var(--mint)}
.task.opt{opacity:.9;border-style:dashed}

.line1{display:flex;align-items:center;gap:9px}
.box{flex:0 0 22px;height:22px;border-radius:8px;border:2px solid #cfc7e0;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:.18s}
.task.done .box{background:var(--mint);border-color:var(--mint);color:#fff}
.lab{font-family:'Changa',sans-serif;font-weight:700;font-size:15px;white-space:nowrap}
.dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:14px}
.val{font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:var(--grape);white-space:nowrap;font-weight:600}
.task.done .val{color:var(--mint)}
.pts{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#fff;
  background:linear-gradient(120deg,var(--grape),var(--rose));padding:2px 8px;border-radius:99px}
.task.done .pts{background:var(--mint)}
.detail{margin-top:10px;padding:11px 12px;border-radius:12px;background:#f7f2fb;font-size:13px;line-height:1.7}
.detail .alt{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--muted)}
.detail .alt b{color:var(--rose)}
.hint{font-size:11.5px;color:var(--muted);margin:6px 0 0 31px}

/* ===== لوحة الأسبوع ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px;
  box-shadow:0 6px 18px rgba(140,110,180,.1)}
.statusrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.statusrow h3{font-family:'Changa',sans-serif;font-size:26px;margin:0;font-weight:800;color:var(--grape)}
.dot{width:15px;height:15px;border-radius:99px}
.bar{height:15px;background:#f0ebf5;border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .5s,background .4s}
.barnums{display:flex;justify-content:space-between;margin-top:8px;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted)}

.reward{margin-top:16px;padding:16px;border-radius:18px;border:1px solid var(--line);
  background:#faf6fe;text-align:center}
.reward .ic{font-size:36px;display:block;filter:grayscale(1);opacity:.4;transition:.3s}
.reward.hit .ic{filter:none;opacity:1}
.reward.hit{background:linear-gradient(140deg,#fff2d6,#ffe6f0);border-color:var(--gold)}
.reward.lost{opacity:.55}
.reward .cap{font-size:11.5px;color:var(--muted);margin:7px 0 2px}
.reward .nm{font-family:'Changa',sans-serif;font-size:19px;font-weight:800;margin:0;color:var(--ink)}
.reward .st{margin-top:10px;font-size:13px;font-weight:700}
.reward.hit .st{color:#d98a00}
.reward.lost .st{color:var(--red)}

.review{margin-top:14px;padding:15px;border-radius:16px;
  background:linear-gradient(140deg,#ffe6f0,#efe9ff);border:1px solid var(--rose)}
.review h4{font-family:'Changa',sans-serif;margin:0 0 6px;font-size:16px;color:var(--rose)}
.review p{margin:0 0 12px;font-size:13px}
.review button{width:100%;padding:11px;border-radius:12px;border:1px solid var(--rose);
  cursor:pointer;font-family:'Almarai',sans-serif;font-weight:800;font-size:13px;background:#fff;color:var(--rose)}

footer{text-align:center;color:var(--muted);font-size:11px;margin-top:26px;line-height:1.9}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(90px);
  background:linear-gradient(120deg,var(--grape),var(--rose));color:#fff;padding:11px 20px;border-radius:99px;font-weight:800;
  font-size:13px;transition:transform .3s;z-index:50;box-shadow:0 8px 24px rgba(255,93,151,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">جدول منو البطلة 🌸</p>
    <h1 id="dayname">—</h1>
    <div class="daterow">
      <div class="subhead" id="datesub">—</div>
      <button id="today" class="todaybtn">اليوم</button>
    </div>
    <div class="navrow">
      <button id="prev">السابق</button>
      <button id="next">التالي</button>
    </div>
  </header>

  <div class="hero">
    <p class="herohead">التقدّم الأسبوعي 🌟</p>
    <div class="weekrings" id="weekRings"></div>
    <div class="periodbar" id="periodBar"></div>
    <div class="periodcap" id="periodCap">٠ من ٦ أسابيع</div>
  </div>

  <div class="tip"><b id="tiplab">نصيحة الأسبوع</b><span id="tiptext">—</span></div>

  <div class="scorerow">
    <div class="ring">
      <svg width="84" height="84" viewBox="0 0 88 88">
        <circle cx="44" cy="44" r="37" fill="none" stroke="#f0ebf5" stroke-width="9"/>
        <circle id="arc" cx="44" cy="44" r="37" fill="none" stroke="url(#g)" stroke-width="9"
                stroke-linecap="round" stroke-dasharray="232" stroke-dashoffset="232"/>
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#8b5cf6"/><stop offset="55%" stop-color="#ff5d97"/>
          <stop offset="100%" stop-color="#ffab1f"/></linearGradient></defs>
      </svg>
      <div class="val"><span class="num" id="todaypct">0%</span><span class="lbl">اليوم</span></div>
    </div>
    <div class="scoretext">
      <h2 id="todayhead">—</h2>
      <p id="todaysub">—</p>
    </div>
  </div>

  <p class="sec">جدول اليوم</p>
  <div id="tasks"></div>

  <p class="sec">الأسبوع</p>
  <section class="panel">
    <div class="statusrow"><h3 id="wkpct">0%</h3><span class="dot" id="dot"></span></div>
    <div class="bar"><div class="fill" id="wkfill" style="width:0%"></div></div>
    <div class="barnums"><span id="wkpts">0</span><span id="wkmax">0</span></div>
    <div class="reward" id="reward"></div>
    <div id="reviewSlot"></div>
  </section>

  <footer>26 يوليو – 31 أغسطس 2026<br>وقت الاستيقاظ هو المرساة — والنوم يتقدّم خلفه.</footer>
</div>
<div class="toast" id="toast">تم</div>

<script>
const START=new Date(2026,6,26), END=new Date(2026,7,31);

const WEEKS=[
 {n:1,wake:'10:00 ص',m1:'10:30 ص',coffee:'11:30 ص',iron:'1:30 م',m2:'2:30 م',nap:'4:00 – 4:45 م',cut:'5:00 م',
  walk:'7:30 م',walkMin:'10 دقائق',res:null,m3:'8:30 م',phone:'12:00 ص',sleep:'1:00 ص',
  tip:'جرعة الحديد تُؤخذ بعد القهوة بساعتين — القهوة تمنع امتصاصه.'},
 {n:2,wake:'9:30 ص',m1:'10:00 ص',coffee:'11:00 ص',iron:'1:00 م',m2:'2:00 م',nap:'3:45 – 4:30 م',cut:'4:40 م',
  walk:'7:00 م',walkMin:'15 دقيقة',res:null,m3:'8:00 م',phone:'11:40 م',sleep:'12:40 ص',
  tip:'الجوال خارج غرفة النوم — هو أقوى مثبّط للنوم في يومك.'},
 {n:3,wake:'9:00 ص',m1:'9:30 ص',coffee:'10:30 ص',iron:'12:30 م',m2:'1:30 م',nap:'3:30 – 4:15 م',cut:'4:20 م',
  walk:'6:45 م',walkMin:'20 دقيقة',res:null,m3:'7:30 م',phone:'11:20 م',sleep:'12:20 ص',
  tip:'آخر قهوة قبل النوم بثماني ساعات — الكافيين يبقى فاعلاً كل هذه المدة.'},
 {n:4,wake:'8:30 ص',m1:'9:00 ص',coffee:'10:00 ص',iron:'12:00 ظ',m2:'1:00 م',nap:'3:15 – 4:00 م',cut:'4:00 م',
  walk:'6:15 م',walkMin:'25 دقيقة',res:{time:'5:45 م',days:[0,3],sets:'جولتان'},m3:'7:00 م',phone:'11:00 م',sleep:'12:00 ص',
  tip:'تمارين المقاومة تبدأ هذا الأسبوع — اعرضي ألم الظهر على طبيبك قبل أول حصة.'},
 {n:5,wake:'8:00 ص',m1:'8:30 ص',coffee:'9:30 ص',iron:'11:30 ص',m2:'12:30 م',nap:'3:00 – 3:45 م',cut:'3:40 م',
  walk:'6:15 م',walkMin:'30 دقيقة',res:{time:'5:45 م',days:[0,2,4],sets:'ثلاث جولات'},m3:'7:00 م',phone:'10:40 م',sleep:'11:40 م',
  tip:'المقاومة صارت ثلاث مرات — وهي ما يحمي عضلك أثناء نزول الوزن لاحقاً.'},
 {n:6,wake:'7:30 ص',m1:'8:00 ص',coffee:'9:00 ص',iron:'11:00 ص',m2:'12:00 ظ',nap:'2:45 – 3:30 م',cut:'3:20 م',
  walk:'5:45 م',walkMin:'30 دقيقة',res:{time:'5:15 م',days:[0,2,4],sets:'ثلاث جولات'},m3:'6:30 م',phone:'10:20 م',sleep:'11:20 م',
  tip:'ثبات وقت الاستيقاظ هو ما يسحب النوم خلفه — لا العكس.'}
];

const REWARDS=[
 {ic:'💅',nm:'مانيكير وباديكير',need:70},
 {ic:'💍',nm:'اكسسوار',need:72},
 {ic:'🌸',nm:'عطر',need:75},
 {ic:'💆‍♀️',nm:'مساج',need:78},
 {ic:'🍽️',nm:'عشاء بمطعم من اختيارك',need:80},
 {ic:'🎁',nm:'مكافأة حرة من اختيارك',need:80}
];

/* الوجبة الأولى — [الأساسي, البديل إن لم تعجبك] */
const MEAL1=[
 ['زبادي يوناني 200 غ + ملعقة صغيرة عسل + ملعقة كبيرة بذور كتان مطحونة','جبن قريش 4 ملاعق + طماطم + 7 حبات لوز'],
 ['بيضتان مسلوقتان + ربع حبة أفوكادو + خيارة','زبادي يوناني 200 غ + ملعقة بذور شيا + نصف موزة'],
 ['سكير 170 غ + نصف كوب توت أزرق + ملعقة بذور شيا','أومليت بيضتين بالسبانخ + شريحة جبن'],
 ['أومليت بيضتين بالسبانخ + شريحة خبز ساوردو','سكير 170 غ + ملعقة زبدة فول سوداني + تفاحة صغيرة'],
 ['زبادي يوناني 200 غ + ملعقة زبدة فول سوداني + رشة قرفة','بيضتان مسلوقتان + ربع حبة أفوكادو + خيارة'],
 ['بيضتان بملعقة زيت زيتون + شريحتا جبن قريش + طماطم','زبادي يوناني 200 غ + ملعقة صغيرة عسل + 10 حبات لوز'],
 ['سكير 170 غ + 10 حبات لوز + ملعقة صغيرة عسل','أومليت بيضتين بالطماطم + شريحة خبز أسمر']
];
const MEAL2=[
 ['صحن سلطة كبير + صدر دجاج مشوي بحجم كفك — ثم كوب رز بسمتي','شوربة عدس + دجاج مشوي + سلطة'],
 ['سلطة + سمكة مشوية متوسطة — ثم حبتا بطاطا مسلوقة','علبة تونة بالماء + سلطة كبيرة + نصف رغيف أسمر'],
 ['سلطة + لحم مشوي 150 غ — ثم كوب رز','كفتة بالفرن مع خضار + سلطة'],
 ['سلطة + دجاج — ثم صحن مكرونة متوسط','مكرونة بالخضار والتونة + سلطة'],
 ['شوربة خضار + دجاج — ثم صينية بطاطا','مسحّب دجاج + سلطة كبيرة'],
 ['سلطة + كوب فول أو حمص — ثم نصف رغيف','شكشوكة ببيضتين + خبز ساوردو'],
 ['سلطة + دجاج مشوي — ثم صينية خضار بالفرن','برجر لحم بيتي + خبز أسمر + سلطة']
];
const MEAL3=[
 ['كوبا شوربة خضار + بيضة مسلوقة','زبادي يوناني + خيار'],
 ['سلطة كبيرة + شريحتا جبن + 5 حبات لوز','شوربة دجاج صافية'],
 ['3 ملاعق لبنة + خيار وطماطم + نصف رغيف ساوردو','بيضتان مسلوقتان + خيار'],
 ['علبة تونة بالماء + سلطة خضراء','كوب شوربة عدس + سلطة صغيرة'],
 ['جاجيك: زبادي يوناني + خيار + جزر مبشور + ربع رغيف أسمر','سلطة كبيرة + شريحة جبن'],
 ['بيضتان مسلوقتان + طماطم وخيار','كوبا شوربة خضار'],
 ['كوب شوربة عدس + سلطة صغيرة','لبنة + خضار + ربع رغيف']
];

const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MON={6:'يوليو',7:'أغسطس'};

function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function di(d){return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-START)/864e5)}
function inRange(d){const i=di(d);return i>=0&&i<=di(END)}
function calWk(d){return Math.floor(di(d)/7)}
function planWeek(d){return WEEKS[Math.max(0,Math.min(5,calWk(d)-state.offset))]}

/* أقصى يوم يُسمح بعرضه = تاريخ اليوم الحقيقي (ضمن المدة). لا أيام مستقبلية. */
function maxView(){
  let t=new Date(); t=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  if(di(t)<0) return new Date(START);
  if(di(t)>di(END)) return new Date(END);
  return t;
}
function isCurrent(d){return key(d)===key(maxView())}

function buildTasks(d){
  const w=planWeek(d), rest=(d.getDay()===5||d.getDay()===6), r=di(d)%7, t=[];
  t.push({id:'wake',lab:'وقت الاستيقاظ',val:w.wake,pts:20,anchor:1,hint:'ثابت كل يوم — حتى في الاستراحة'});
  t.push({id:'m1',lab:'الوجبة الأولى',val:w.m1,pts:15,detail:MEAL1[r][0],alt:MEAL1[r][1]});
  t.push({id:'coffee1',lab:'القهوة',val:w.coffee,pts:0,skip:1});
  t.push({id:'iron',lab:'وقت الدواء',val:w.iron,pts:10,detail:'حبة الحديد + برتقالة أو عصير ليمون — بعد القهوة بساعتين'});
  if(rest){
    t.push({id:'m2',lab:'الوجبة الثانية',val:w.m2,pts:12,detail:'يوم استراحة — الأكل مفتوح تماماً. اختاري ما تشتهين.'});
  }else{
    t.push({id:'m2',lab:'الوجبة الثانية',val:w.m2,pts:12,detail:MEAL2[r][0],alt:MEAL2[r][1]});
    if(w.n>=4) t.push({id:'seq',lab:'ترتيب الصحن',val:w.m2,pts:8,detail:'خضار وسلطة وبروتين أولاً — ثم النشويات والحلويات بلا تحديد'});
  }
  t.push({id:'nap',lab:'القيلولة',val:w.nap,pts:3,opt:1,hint:'اختيارية — نقاط إضافية إن نمتِ'});
  if(w.n>=3) t.push({id:'cut',lab:'آخر قهوة',val:'قبل '+w.cut,pts:8});
  if(w.res && w.res.days.indexOf(d.getDay())>=0)
    t.push({id:'res',lab:'تمارين المقاومة',val:w.res.time,pts:10,
      detail:'كرسي + حائط + قنينتا ماء (لتر ونصف لكل واحدة)<br>'+
             '• القيام من الكرسي والجلوس × 10<br>'+
             '• ضغط على الحائط بميل 30 درجة × 12<br>'+
             '• رفع القنينتين إلى مستوى الكتف × 12<br>'+
             '<b>'+w.res.sets+'</b> — راحة 30–60 ثانية بين كل جولة',
      hint:'إن أوجعك ظهرك توقّفي فوراً — وراجعي طبيبك قبل المتابعة'});
  t.push({id:'walk',lab:'المشي',val:w.walk,pts:12,
    detail:'<b>'+w.walkMin+'</b> بعد المغرب في الحي — أو داخل البيت ذهاباً وإياباً إن كانت الحرارة أو الرضيع عائقاً',
    hint:'سرعة تسمح لك بالكلام ولا تسمح بالغناء'});
  if(rest){
    t.push({id:'m3',lab:'الوجبة الثالثة',val:w.m3,pts:12,detail:'مفتوحة — الشرط الوحيد أن تكون قبل النوم بساعتين'});
  }else{
    t.push({id:'m3',lab:'الوجبة الثالثة',val:w.m3,pts:12,detail:MEAL3[r][0],alt:MEAL3[r][1]});
  }
  if(w.n>=2) t.push({id:'phone',lab:'الجوال خارج الغرفة',val:w.phone,pts:10});
  t.push({id:'sleep',lab:'وقت النوم',val:w.sleep,pts:20,anchor:1,hint:'ولو لم يأتِ النوم — استلقي بلا جوال'});
  return t;
}
const scored=d=>buildTasks(d).filter(x=>!x.skip);
function dayMax(d){return scored(d).reduce((s,x)=>s+x.pts,0)}
function dayEarned(d){const done=state.days[key(d)]||[];
  return scored(d).reduce((s,x)=>s+(done.includes(x.id)?x.pts:0),0)}
function weekFullMax(wi){let m=0;for(let i=0;i<7;i++){const d=new Date(START);d.setDate(START.getDate()+wi*7+i);if(inRange(d))m+=dayMax(d);}return m}
function weekEarned(wi){let e=0;for(let i=0;i<7;i++){const d=new Date(START);d.setDate(START.getDate()+wi*7+i);if(inRange(d)&&di(d)<=di(maxView()))e+=dayEarned(d);}return e}

let state={days:{},offset:0}, view=new Date();
const KEY='mano-tracker';

const store={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY); return r&&r.value?r.value:null;} }catch(e){}
    try{ return localStorage.getItem(KEY); }catch(e){}
    return null;
  },
  async set(v){
    let ok=false;
    try{ if(window.storage){await window.storage.set(KEY,v); ok=true;} }catch(e){}
    try{ localStorage.setItem(KEY,v); ok=true; }catch(e){}
    return ok;
  }
};
async function load(){
  const raw=await store.get();
  if(raw){try{const p=JSON.parse(raw);state.days=p.days||{};state.offset=p.offset||0}catch(e){}}
}
async function save(){ if(!await store.set(JSON.stringify(state))) toast('تعذّر الحفظ'); }
let tt;function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');
  clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1300)}
const pct=(a,b)=>b?Math.round(a/b*100):0;

function render(){
  const mv=maxView();
  if(!inRange(view)) view=new Date(mv);
  if(di(view)>di(mv)) view=new Date(mv);
  if(di(view)<0) view=new Date(START);
  const w=planWeek(view);
  document.getElementById('dayname').textContent=DAYS[view.getDay()];
  document.getElementById('datesub').textContent=view.getDate()+' '+MON[view.getMonth()]+' 2026'+
    ((view.getDay()===5||view.getDay()===6)?' · يوم استراحة':'')+
    (isCurrent(view)?'':' · مراجعة يوم سابق');
  document.getElementById('next').disabled=isCurrent(view);
  document.getElementById('prev').disabled=(di(view)<=0);
  document.getElementById('tiptext').textContent=w.tip;

  const done=state.days[key(view)]||[], box=document.getElementById('tasks');
  box.innerHTML='';
  const f=document.createElement('div');f.className='fajr';
  f.innerHTML='<span class="lab">صلاة الفجر</span><span class="dots"></span><span class="val">4:00 ص</span>'+
    '<span class="note">ثم عودة للنوم — هذه ليست نقطة استيقاظ</span>';
  box.appendChild(f);

  buildTasks(view).forEach(t=>{
    if(t.skip){
      const e=document.createElement('div');e.className='fajr';
      e.style.background='#f5f2fa';e.style.borderColor='var(--line)';e.style.borderStyle='dashed';
      e.innerHTML='<span class="lab" style="color:var(--muted)">'+t.lab+'</span><span class="dots" style="border-color:var(--line)"></span>'+
        '<span class="val" style="color:var(--muted)">'+t.val+'</span>';
      box.appendChild(e);return;
    }
    const b=document.createElement('button');
    b.className='task'+(done.includes(t.id)?' done':'')+(t.anchor?' anchor':'')+(t.opt?' opt':'');
    b.setAttribute('aria-pressed',done.includes(t.id));
    let h='<span class="line1"><span class="box">✓</span><span class="lab">'+t.lab+
      '</span><span class="dots"></span><span class="val">'+t.val+'</span><span class="pts">'+t.pts+'</span></span>';
    if(t.detail) h+='<span class="detail">'+t.detail+
      (t.alt?'<span class="alt"><b>ما عجبتك؟</b> '+t.alt+'</span>':'')+'</span>';
    if(t.hint) h+='<span class="hint">'+t.hint+'</span>';
    b.innerHTML=h; b.onclick=()=>toggle(t.id); box.appendChild(b);
  });

  const de=dayEarned(view), dm=dayMax(view), dp=pct(de,dm);
  document.getElementById('todaypct').textContent=dp+'%';
  document.getElementById('arc').style.strokeDashoffset=232-(232*dp/100);
  document.getElementById('todayhead').textContent=de+' من '+dm+' نقطة';
  document.getElementById('todaysub').textContent=dp===100?'يوم كامل 🎉':dp>=70?'ماشية كويس 💪':dp>=40?'باقي عناصر':'ابدئي بالاستيقاظ والنوم';
  drawWeek(); drawWeeklyProgress();
}

/* رسم التقدّم الأسبوعي: دائرة لكل أسبوع + خانة الفترة الكاملة */
function drawWeeklyProgress(){
  const rings=document.getElementById('weekRings'); rings.innerHTML='';
  const segs=document.getElementById('periodBar'); segs.innerHTML='';
  let passedCount=0;
  for(let wi=0;wi<6;wi++){
    const full=weekFullMax(wi), earned=weekEarned(wi);
    const rw=REWARDS[Math.max(0,Math.min(5,wi-state.offset))];
    const need=Math.ceil(full*rw.need/100);
    const started=di(new Date(START.getFullYear(),START.getMonth(),START.getDate()+wi*7))<=di(maxView());
    const ringP=need?Math.min(100,Math.round(earned/need*100)):0;
    const passed=started&&need>0&&earned>=need;
    const active=started&&earned>0&&!passed;
    const c=passed?'#12c2a0':active?'#ffdf6b':'rgba(255,255,255,.85)';
    if(passed)passedCount++;
    const r=document.createElement('div');r.className='wring';
    r.innerHTML='<div class="wdisc" style="--p:'+(started?ringP:0)+';--c:'+c+'"><b>'+(wi+1)+'</b></div>'+
      '<span class="wlbl">'+(started?ringP+'%':'—')+'</span>';
    rings.appendChild(r);
    const s=document.createElement('div');
    s.className='pseg'+(passed?' done':active?' part':'');
    segs.appendChild(s);
  }
  document.getElementById('periodCap').textContent=passedCount+' من 6 أسابيع';
}

function drawWeek(){
  const wi=calWk(view); let earned=0,max=0,elapsed=0;
  for(let i=0;i<7;i++){
    const d=new Date(START); d.setDate(START.getDate()+wi*7+i);
    if(!inRange(d))continue;
    max+=dayMax(d); earned+=dayEarned(d);
    if(di(d)<=di(maxView())) elapsed+=dayMax(d);
  }
  const p=pct(earned,max), pace=elapsed?earned/elapsed*100:0;
  document.getElementById('wkpct').textContent=p+'%';
  document.getElementById('wkpts').textContent=earned+' نقطة';
  document.getElementById('wkmax').textContent='من '+max;

  const col = pace>=75?'var(--mint)' : pace>=50?'var(--gold)' : 'var(--red)';
  const fill=document.getElementById('wkfill');
  fill.style.width=Math.min(100,p)+'%'; fill.style.background=col;
  document.getElementById('dot').style.background=col;

  const rw=REWARDS[Math.max(0,Math.min(5,wi-state.offset))];
  const need=Math.ceil(max*rw.need/100), hit=earned>=need;
  const weekOver = di(maxView()) > di(new Date(START.getFullYear(),START.getMonth(),START.getDate()+wi*7+6));
  const lost = weekOver && !hit;
  const el=document.getElementById('reward');
  el.className='reward'+(hit?' hit':'')+(lost?' lost':'');
  el.innerHTML='<span class="ic">'+rw.ic+'</span><p class="cap">مكافأة هذا الأسبوع · تحتاج '+rw.need+'%</p>'+
    '<p class="nm">'+rw.nm+'</p><div class="st">'+
    (hit?'مستحقة ✓':lost?'فاتت — تبدأ مكافأة جديدة':'باقي '+(need-earned)+' نقطة')+'</div>';

  const rs=document.getElementById('reviewSlot'); rs.innerHTML='';
  if(view.getDay()===6 && isCurrent(view) && !hit){
    const d=document.createElement('div'); d.className='review';
    d.innerHTML='<h4>مراجعة الأسبوع '+planWeek(view).n+'</h4>'+
      '<p>أنهيتِ الأسبوع بـ'+p+'%. التكرار ليس فشلاً — هو التصميم الصحيح.</p>'+
      '<button id="rep">كرري هذا الأسبوع بدل الانتقال</button>';
    rs.appendChild(d);
    document.getElementById('rep').onclick=async()=>{state.offset++;await save();toast('سيتكرر نفس الأسبوع');render()};
  }
}

async function toggle(id){
  const k=key(view), a=(state.days[k]||[]).slice(), i=a.indexOf(id);
  if(i>=0)a.splice(i,1); else a.push(id);
  state.days[k]=a; render(); await save(); if(i<0)toast('+ تم');
}

document.getElementById('prev').onclick=()=>{if(di(view)<=0){toast('هذا أول يوم');return}view.setDate(view.getDate()-1);render()};
document.getElementById('next').onclick=()=>{
  if(isCurrent(view)){toast('جدول بكرة يفتح بكرة');return}
  view.setDate(view.getDate()+1);render();
};
document.getElementById('today').onclick=()=>{view=maxView();render()};

/* يتحدّث بنفسه عند تغيّر اليوم */
let lastDay=key(new Date());
function tick(){
  const k=key(new Date());
  if(k!==lastDay){lastDay=k;view=maxView();render();toast('يوم جديد — جدولك تحدّث')}
}
setInterval(tick,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
window.addEventListener('focus',tick);

(async()=>{
  await load();
  view=maxView();
  render();
})();
</script>
